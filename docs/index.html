<!doctype html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<title>Note Reader</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2d9b83">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Note Reader">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="hd">
    <button id="menu-btn" class="ico" aria-label="カテゴリ">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div id="ttl-wrap"><span id="ttl">すべて</span><span id="cnt"></span></div>
    <button id="refresh-btn" class="ico" aria-label="記事を更新">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M23 4v6h-6M1 20v-6h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="markall-btn" class="ico" aria-label="全て既読にする">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="add-btn" class="ico" aria-label="＋登録">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <div id="filters" role="group">
    <button data-filter="unread">未読</button>
    <button data-filter="all">全て</button>
    <button data-filter="read">既読</button>
    <button data-filter="starred">スター</button>
  </div>

  <div id="tools">
    <input type="search" id="search" placeholder="タイトル検索" autocomplete="off" enterkeyhint="search">
    <select id="sort" aria-label="並び順">
      <option value="date:desc">日付（新しい順）</option>
      <option value="date:asc">日付（古い順）</option>
      <option value="creator:asc">クリエイター名（昇順）</option>
      <option value="creator:desc">クリエイター名（降順）</option>
      <option value="category:asc">カテゴリ（昇順）</option>
      <option value="category:desc">カテゴリ（降順）</option>
    </select>
  </div>

  <button id="new-bar" hidden>新着</button>
  <main id="list"></main>
  <div id="toast" role="status" hidden></div>
</div>

<div id="scrim" hidden></div>
<aside id="drawer" aria-hidden="true">
  <div class="pane-hd">カテゴリ</div>
  <nav id="cat-list"></nav>
  <button id="settings-btn" class="drawer-foot">設定</button>
</aside>

<dialog id="add-dlg">
  <form method="dialog">
    <h2>クリエイターを登録</h2>
    <label>noteのURLまたはID
      <input id="add-id" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url">
    </label>
    <label>カテゴリ
      <select id="add-cat"></select>
    </label>
    <input id="add-newcat" type="text" placeholder="新しいカテゴリ名" hidden>
    <p id="add-msg" class="msg" hidden></p>
    <div class="dlg-btns">
      <button type="button" class="sub" data-close>キャンセル</button>
      <button type="button" class="pri" id="add-ok">登録</button>
    </div>
  </form>
</dialog>

<dialog id="edit-dlg">
  <form method="dialog">
    <h2 id="edit-name"></h2>
    <a id="edit-prof" class="link" target="_blank" rel="noopener">プロフィールを開く</a>
    <label>カテゴリ
      <select id="edit-cat"></select>
    </label>
    <input id="edit-newcat" type="text" placeholder="新しいカテゴリ名" hidden>
    <div class="dlg-btns">
      <button type="button" class="danger" id="edit-del">削除</button>
      <span class="grow"></span>
      <button type="button" class="sub" data-close>キャンセル</button>
      <button type="button" class="pri" id="edit-ok">保存</button>
    </div>
  </form>
</dialog>

<dialog id="cat-dlg">
  <form method="dialog">
    <h2>カテゴリを編集</h2>
    <label>カテゴリ名
      <input id="cat-name" type="text" autocomplete="off">
    </label>
    <div class="dlg-btns">
      <button type="button" class="danger" id="cat-del">削除</button>
      <span class="grow"></span>
      <button type="button" class="sub" data-close>キャンセル</button>
      <button type="button" class="pri" id="cat-ok">保存</button>
    </div>
  </form>
</dialog>

<dialog id="set-dlg">
  <form method="dialog">
    <h2>設定</h2>
    <fieldset id="set-theme">
      <legend>テーマ</legend>
      <label><input type="radio" name="theme" value="auto">自動</label>
      <label><input type="radio" name="theme" value="light">ライト</label>
      <label><input type="radio" name="theme" value="dark">ダーク</label>
    </fieldset>
    <label id="notify-row" class="toggle" hidden>新着の通知<input type="checkbox" role="switch" id="set-notify"></label>
    <p id="set-msg" class="msg" hidden></p>
    <div id="install" hidden>
      <h3>ホーム画面に追加</h3>
      <p><b>iPhone</b>：Safariの共有ボタン →「ホーム画面に追加」</p>
      <p><b>Android</b>：Chromeのメニュー →「ホーム画面に追加」または「アプリをインストール」</p>
    </div>
    <a class="link" href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>
    <div class="dlg-btns">
      <span class="grow"></span>
      <button type="button" class="pri" data-close>閉じる</button>
    </div>
  </form>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
