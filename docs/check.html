<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Note Reader 確認</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<style>
:root { color-scheme:light dark; }
body { max-width:640px; margin:0 auto; padding:16px; font:15px/1.7 Roboto,'Hiragino Sans',Meiryo,sans-serif; background:Canvas; color:CanvasText; }
h1 { font-size:18px; margin:0 0 12px; }
dt { font-weight:bold; margin-top:12px; }
dd { margin:0; overflow-wrap:anywhere; }
</style>
</head>
<body>
<h1>Note Reader 確認</h1>
<dl id="out"></dl>
<script>
// 保存内容を読むだけ。書き込みも送信もしない
const out = document.getElementById('out');
function show(label, value) {
  const dt = document.createElement('dt'), dd = document.createElement('dd');
  dt.textContent = label; dd.textContent = value;
  out.append(dt, dd);
}
function readDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('note-reader');
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('kv')) { db.close(); return resolve({}); }
      const store = db.transaction('kv').objectStore('kv');
      const data = {};
      ['favoriteCreators', 'nfrStarred', 'settings'].forEach(k => {
        store.get(k).onsuccess = e => { data[k] = e.target.result; };
      });
      store.transaction.oncomplete = () => { db.close(); resolve(data); };
    };
  });
}
(async () => {
  try {
    const dbs = indexedDB.databases ? await indexedDB.databases() : null;
    const found = dbs ? dbs.some(d => d.name === 'note-reader') : null;
    show('保存場所', found === null ? '不明' : found ? 'あり' : 'なし');
    if (found !== false) {
      const d = await readDb();
      const list = d.favoriteCreators || [];
      show('登録', `${list.length}名`);
      show('名前', list.slice(0, 10).map(c => c.name).join('、') || '—');
      const ids = list.map(c => c.id).filter(id => typeof id === 'number');
      show('最後の登録', ids.length ? new Date(Math.max(...ids)).toLocaleString('ja-JP') : '—');
      show('スター', `${(d.nfrStarred || []).length}件`);
    }
    const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration('./') : null;
    show('版', (await caches.keys()).join('、') || '—');
    show('動作', reg ? (reg.active ? reg.active.state : '待機中') : 'なし');
    if (navigator.storage && navigator.storage.persisted) show('保護', (await navigator.storage.persisted()) ? 'あり' : 'なし');
    show('ブラウザ', navigator.userAgent);
  } catch (e) {
    show('エラー', e.name + '：' + e.message);
  }
})();
</script>
</body>
</html>
